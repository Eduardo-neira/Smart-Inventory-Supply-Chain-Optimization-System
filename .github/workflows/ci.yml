name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A lockfile is intentionally added in the dependency-hardening follow-up.
      # This temporary install keeps CI usable while the project has none.
      - run: npm install
      - run: npm run build
